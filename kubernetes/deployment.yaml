apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudit
  namespace: cloudit
  labels:
    app: cloudit
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudit
  template:
    metadata:
      labels:
        app: cloudit
    spec:
      containers:
        - name: cloudit
          image: cloudit:v3
          imagePullPolicy: Never
          envFrom:
          - configMapRef:
              name: cloudit-config
          - secretRef:
              name: cloudit-secret
          ports:
            - containerPort: 80

          startupProbe:
              httpGet:
                path: /
                port: 80
              periodSeconds: 5
              failureThreshold: 12
              timeoutSeconds: 2

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"