services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudit-postgres
    restart: unless-stopped

    env_file:
      - .env.production

    volumes:
      - cloudit-postgres-production:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - cloudit-production

    mem_limit: 256m

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: ${API_IMAGE:-cloudit-api:production}
    container_name: cloudit-api
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

    networks:
      - cloudit-production

    mem_limit: 192m

  frontend:
    build:
      context: ./Website
      dockerfile: Dockerfile.fullstack

    image: ${FRONTEND_IMAGE:-cloudit-frontend:production}
    container_name: cloudit-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - cloudit-production

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/operations.html || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    mem_limit: 96m

networks:
  cloudit-production:
    name: cloudit-production

volumes:
  cloudit-postgres-production:
    name: cloudit-postgres-production
