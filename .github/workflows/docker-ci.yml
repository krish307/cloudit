name: CloudIt Production CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: Validate CloudIt Full Stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env.production <<'EOF'
          POSTGRES_DB=clouditdb
          POSTGRES_USER=cloudit_ci
          POSTGRES_PASSWORD=ci-only-password
          EOF

      - name: Validate production Compose
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.aws.fullstack.yaml \
            config --quiet

      - name: Build API
        run: |
          docker build \
            -t cloudit-api:ci \
            ./backend

      - name: Build frontend
        run: |
          docker build \
            -t cloudit-frontend:ci \
            -f Website/Dockerfile.fullstack \
            Website

      - name: Start CI full stack
        run: |
          API_IMAGE=cloudit-api:ci \
          FRONTEND_IMAGE=cloudit-frontend:ci \
          docker compose \
            --env-file .env.production \
            -f compose.aws.fullstack.yaml \
            up -d --no-build

      - name: Wait for application health
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost/health > /dev/null; then
              echo "CloudIt is healthy."
              exit 0
            fi

            echo "Waiting for CloudIt..."
            sleep 5
          done

          docker compose \
            --env-file .env.production \
            -f compose.aws.fullstack.yaml \
            ps

          exit 1

      - name: Verify Operations Dashboard
        run: curl --fail http://localhost/operations.html

      - name: Verify API
        run: curl --fail http://localhost/health

      - name: Verify PostgreSQL-backed API
        run: curl --fail http://localhost/api/operations

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.aws.fullstack.yaml \
            logs

      - name: Clean up
        if: always()
        run: |
          docker compose \
            --env-file .env.production \
            -f compose.aws.fullstack.yaml \
            down -v || true

  build-and-push-ecr:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest
    needs: validation

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: CloudItGitHubActions
          allowed-account-ids: "832569408670"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:api-$SHA" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:api-latest" \
            ./backend

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:api-$SHA"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:api-latest"

      - name: Build and push frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -f Website/Dockerfile.fullstack \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-$SHA" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest" \
            Website

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-$SHA"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest"

  deploy:
    name: Deploy Full Stack to CloudIt EC2
    runs-on: ubuntu-latest

    needs:
      - validation
      - build-and-push-ecr

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy CloudIt production
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" <<'EOF'
            set -euo pipefail

            cd /home/ubuntu/cloudit

            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main

            echo "Logging into Amazon ECR..."
            aws ecr get-login-password --region ap-southeast-2 | \
              docker login \
                --username AWS \
                --password-stdin \
                832569408670.dkr.ecr.ap-southeast-2.amazonaws.com

            export API_IMAGE="832569408670.dkr.ecr.ap-southeast-2.amazonaws.com/cloudit-app:api-latest"
            export FRONTEND_IMAGE="832569408670.dkr.ecr.ap-southeast-2.amazonaws.com/cloudit-app:frontend-latest"

            echo "Pulling production images..."
            docker compose \
              --env-file .env.production \
              -f compose.aws.fullstack.yaml \
              pull api frontend postgres

            echo "Deploying CloudIt..."
            docker compose \
              --env-file .env.production \
              -f compose.aws.fullstack.yaml \
              up -d \
              --no-build \
              --remove-orphans

            echo "Waiting for health..."
            for i in {1..20}; do
              if curl --fail --silent http://127.0.0.1/health > /dev/null; then
                echo "CloudIt is healthy."
                break
              fi

              if [ "$i" -eq 20 ]; then
                echo "Deployment health check failed."

                docker compose \
                  --env-file .env.production \
                  -f compose.aws.fullstack.yaml \
                  ps

                exit 1
              fi

              sleep 5
            done

            docker compose \
              --env-file .env.production \
              -f compose.aws.fullstack.yaml \
              ps

            curl --fail http://127.0.0.1/operations.html > /dev/null
            curl --fail http://127.0.0.1/health
            curl --fail http://127.0.0.1/api/operations

            echo
            echo "CloudIt production deployment completed."
          EOF

      - name: Verify public deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl \
            --fail \
            --retry 10 \
            --retry-delay 3 \
            "http://$EC2_HOST/operations.html"

          curl \
            --fail \
            --retry 10 \
            --retry-delay 3 \
            "http://$EC2_HOST/health"