apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
      - name: prometheus

        image: prom/prometheus:v2.54.1

        args:
          - "--config.file=/etc/prometheus/prometheus.yml"

        ports:
          - containerPort: 9090

        volumeMounts:
          - name: prometheus-config
            mountPath: /etc/prometheus

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config