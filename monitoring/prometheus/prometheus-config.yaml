apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets:
              - "localhost:9090"

      - job_name: "blackbox-exporter"
        static_configs:
          - targets:
              - "blackbox-exporter.monitoring.svc.cluster.local:9115"

      - job_name: "cloudit-http"
        metrics_path: /probe
        params:
          module:
            - http_2xx

        static_configs:
          - targets:
              - "http://cloudit-service.cloudit.svc.cluster.local"

        relabel_configs:
          - source_labels:
              - __address__
            target_label: __param_target

          - source_labels:
              - __param_target
            target_label: instance

          - target_label: __address__
            replacement: "blackbox-exporter.monitoring.svc.cluster.local:9115"